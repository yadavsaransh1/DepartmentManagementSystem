spring:
  application:
    name: Department Management System
  
  datasource:
    url: jdbc:mysql://localhost:3306/university_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: yadavji
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  mvc:
    cors:
      # CORS configuration is handled in SecurityConfig.java
      # Disabled YAML CORS to avoid conflicts with Java DSL config
  
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080
  address: localhost
  servlet:
    context-path: /

jwt:
  secret: your-secret-key-change-this-in-production-environment-very-long-and-secure-key
  expiration: 86400000

logging:
  level:
    root: WARN
    com.department: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
